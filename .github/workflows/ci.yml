name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations are in sync with the schema
        run: |
          pnpm db:generate --name ci-drift-check
          git diff --exit-code -- drizzle || (echo "Schema changed without a migration; run pnpm db:generate" && exit 1)
          test -z "$(git status --porcelain -- drizzle)" || (echo "Uncommitted migration generated" && git status -- drizzle && exit 1)
      - run: pnpm build
      - name: Smoke test (production build)
        run: |
          cp -r .next/static .next/standalone/.next/static
          export STACK_MANAGER_DATA_DIR="$RUNNER_TEMP/sm-data"
          export STACK_MANAGER_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export STACK_MANAGER_SESSION_SECRET="$(openssl rand -base64 48)"
          export STACK_MANAGER_COOKIE_SECURE=false PORT=3000 HOSTNAME=127.0.0.1
          (cd .next/standalone && node server.js > "$RUNNER_TEMP/server.log" 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/health && break; sleep 1; done
          BASE_URL=http://127.0.0.1:3000 scripts/smoke.sh || (cat "$RUNNER_TEMP/server.log"; exit 1)
      - name: UI tests (Playwright + axe, production build)
        env:
          # Public, credential-free sample repository for the source workspace (editor) tests.
          E2E_GIT_REMOTE: https://github.com/docker/awesome-compose.git
          E2E_STACK_ROOT: nginx-golang
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Dependency audit (production deps)
        run: pnpm audit --prod --audit-level high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t stack-manager:ci .
      - name: Container starts, migrates and reports healthy
        run: |
          docker run -d --name sm --read-only --tmpfs /tmp --cap-drop ALL \
            -e STACK_MANAGER_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e STACK_MANAGER_SESSION_SECRET="$(openssl rand -base64 48)" \
            -v sm-data:/data -p 3000:3000 stack-manager:ci
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' sm)" = healthy ] && break; sleep 2; done
          docker inspect -f '{{.State.Health.Status}}' sm | grep -q healthy || (docker logs sm; exit 1)
      - name: Refuses to start without an encryption key
        run: |
          if docker run --rm -e STACK_MANAGER_SESSION_SECRET="$(openssl rand -base64 48)" stack-manager:ci; then
            echo "expected failure"; exit 1
          fi
