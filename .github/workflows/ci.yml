name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Lint workflows (actionlint + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The official image bundles shellcheck, so run: blocks are linted too.
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Native builds are deliberately limited to the existing approved dependencies.
      - run: pnpm rebuild better-sqlite3 esbuild
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations are in sync with the schema
        run: |
          pnpm db:generate --name ci-drift-check
          git diff --exit-code -- drizzle || (echo "Schema changed without a migration; run pnpm db:generate" && exit 1)
          test -z "$(git status --porcelain -- drizzle)" || (echo "Uncommitted migration generated" && git status -- drizzle && exit 1)
      - run: pnpm build
      - name: Smoke test (production build)
        run: |
          cp -r .next/static .next/standalone/.next/static
          export STACK_MANAGER_DATA_DIR="$RUNNER_TEMP/sm-data"
          STACK_MANAGER_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          STACK_MANAGER_SESSION_SECRET="$(openssl rand -base64 48)"
          export STACK_MANAGER_ENCRYPTION_KEY STACK_MANAGER_SESSION_SECRET
          export STACK_MANAGER_COOKIE_SECURE=false PORT=3000 HOSTNAME=127.0.0.1
          (cd .next/standalone && node server.js > "$RUNNER_TEMP/server.log" 2>&1 &)
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/health && break; sleep 1; done
          BASE_URL=http://127.0.0.1:3000 scripts/smoke.sh || (cat "$RUNNER_TEMP/server.log"; exit 1)
      - name: UI tests (Playwright + axe, production build)
        env:
          # Public, credential-free sample repository for the source workspace (editor) tests.
          E2E_GIT_REMOTE: https://github.com/docker/awesome-compose.git
          E2E_STACK_ROOT: nginx-golang
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Dependency audit (production deps)
        run: pnpm audit --prod --audit-level high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t stack-manager:ci .
      - name: Container starts, migrates and reports healthy
        run: |
          docker run -d --name sm --read-only --tmpfs /tmp --cap-drop ALL \
            -e STACK_MANAGER_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e STACK_MANAGER_SESSION_SECRET="$(openssl rand -base64 48)" \
            -e STACK_MANAGER_COOKIE_SECURE=false \
            -v sm-data:/data -p 127.0.0.1:3000:3000 stack-manager:ci
          for _ in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' sm)" = healthy ] && break; sleep 2; done
          docker inspect -f '{{.State.Health.Status}}' sm | grep -q healthy || (docker logs sm; exit 1)
      - name: Production smoke and persistent database survive restart
        run: |
          BASE_URL=http://127.0.0.1:3000 scripts/smoke.sh
          docker restart --timeout 10 sm
          for _ in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' sm)" = healthy ] && break; sleep 2; done
          docker inspect -f '{{.State.Health.Status}}' sm | grep -q healthy || (docker logs sm; exit 1)
          docker exec sm node -e '
            const { DatabaseSync } = require("node:sqlite");
            const db = new DatabaseSync("/data/stack-manager.sqlite", { readOnly: true });
            try {
              if (db.prepare("SELECT count(*) AS n FROM workspaces WHERE slug = ?").get("smoke").n !== 1)
                throw new Error("Workspace was not preserved across restart");
              if (!db.prepare("SELECT name FROM sqlite_master WHERE type = ? AND name = ?").get("table", "deployment_routing_decisions"))
                throw new Error("Routing migration missing after restart");
            } catch (error) {
              try { db.close(); } catch {}
              throw error;
            }
            db.close();
          '
      - name: Refuses to start without an encryption key
        run: |
          if docker run --rm -e STACK_MANAGER_SESSION_SECRET="$(openssl rand -base64 48)" stack-manager:ci; then
            echo "expected failure"; exit 1
          fi
