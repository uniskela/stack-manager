name: PR title

# PRs are squash-merged, so the PR title becomes the commit message on main. Release Please only
# understands Conventional Commits (feat:, fix:, …), so every PR title must follow that format.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check PR title
        env:
          # Passed via env (never interpolated into the script) because titles are untrusted input.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style|security)(\([a-z0-9._/-]+\))?!?: [^ ].+'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(editor): add command palette' or 'fix: handle empty compose files'."
            echo "Got: $TITLE"
            exit 1
          fi
