name: Container security

on:
  pull_request:
    paths:
      - '.github/workflows/container-security.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.ts'
      - 'docker-compose*.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/container-security.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.ts'
      - 'docker-compose*.yml'
  schedule:
    # Re-scan weekly so newly disclosed vulnerabilities are caught even when nothing changed.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: container-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Image and configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Dockerfile and compose configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan production dependencies (pnpm-lock.yaml)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: stack-manager-security:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=security
          cache-to: type=gha,mode=max,scope=security

      - name: Runtime image ships no package managers
        run: |
          docker run --rm --entrypoint sh "stack-manager-security:${{ github.sha }}" -c '
            set -eu
            ! command -v npm
            ! command -v npx
            ! command -v corepack
            ! command -v yarn
            test ! -e /usr/local/lib/node_modules/npm
            node -e "process.exit(0)"
          '

      - name: Record full vulnerability inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: stack-manager-security:${{ github.sha }}
          scanners: vuln
          format: json
          output: trivy-image.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          timeout: 10m

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image-${{ github.sha }}
          path: trivy-image.json
          if-no-files-found: warn
          retention-days: 14

      - name: Gate on fixable high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: stack-manager-security:${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          timeout: 10m
